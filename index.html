<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale = 1.0">
		<title>25年12月6日记</title>
		<style>
			textarea{
				width: 500px;
				height:500px;
			}
			button{
				display: flex;
				position: absolute;
				left: 225px;
				width: 50px;
				background-color: #39c5bb;
			}
		</style>
	</head>
	<body>
		<ul class="show">

		</ul>
		<textarea></textarea>
		<button>发布</button>

		<script>
			const liuyan = document.querySelector('.show')
			const text = document.querySelector('textarea')
			const btn = document.querySelector('button');


			btn.onclick = function() {
				const li = document.createElement('li');
				if (text.value == '') {
					alert('留言不能为空！');
					return;
				} else {
					li.innerHTML = text.value + '&nbsp;&nbsp;<a href="#" class="de">X</a>'
					liuyan.appendChild(li);
					text.value = ''
				}
			}

		liuyan.addEventListener('click', function(e) {
		 	if (e.target.tagName === 'A'){
		 		e.target.parentElement.remove();
			}
		 }

		</script>
	</body>
</html>
